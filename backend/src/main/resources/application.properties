spring.application.name=polizas-api
spring.main.banner-mode=off
server.port=8080

# Base de datos en memoria (solo desarrollo / laboratorio)
spring.datasource.url=jdbc:h2:mem:polizasdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# El esquema se define en schema.sql; Hibernate solo valida
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=false
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.jackson.serialization.write-dates-as-timestamps=false
